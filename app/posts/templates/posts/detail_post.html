{% extends 'base.html' %}
{% block title %}POST №{{ post["id"] }}{% endblock %}

{% block content %}
<div class="container py-5">
  <div class="card shadow border-0 mx-auto"
       style="border-radius: 15px; background-color: #1e1e1e; max-width: 800px;">
    <div class="card-body text-light">
      <h1 class="h4 mb-3" style="color: var(--accent-color);">
        Пост № {{ post["id"] }} — {{ post["title"] }}
      </h1>

      <p class="fs-5 mb-4 text-secondary" style="line-height: 1.7;">
        {{ post.get('content') }}
      </p>

      <a href="{{ url_for('posts.get_posts') }}"
         class="btn btn-outline-light">
        ← Повернутись до списку
      </a>
    </div>
  </div>
</div>
{% endblock %}
