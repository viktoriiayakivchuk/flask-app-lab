{% extends 'base.html' %}
{% block title %}POSTS{% endblock %}

{% block content %}
<div class="container py-5">
  <h1 class="text-center mb-4" style="color: var(--accent-color);">Пости</h1>

  <ul class="list-group shadow-sm"
      style="background-color: #1e1e1e; border-radius: 12px;">
    {% for post in posts %}
    <li class="list-group-item d-flex justify-content-between align-items-center"
        style="background-color: #1e1e1e; color: #eaeaea; border-color: rgba(255, 255, 255, 0.1);">
      <span class="text-secondary">#{{ post["id"] }}</span>
      <a href="{{ post['id'] }}" class="fw-semibold text-decoration-none"
         style="color: #eaeaea;">
        {{ post["title"] }}
      </a>
    </li>
    {% endfor %}
  </ul>
</div>
{% endblock %}
