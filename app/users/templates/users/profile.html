{% extends 'base.html' %}

{% block title %}Profile Page{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-8 col-lg-6 text-center">

        <div class="mb-3">
            <svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" fill="currentColor" class="bi bi-person-circle" viewBox="0 0 16 16" style="color: var(--accent-color);">
                <path d="M11 6a3 3 0 1 1-6 0 3 3 0 0 1 6 0z"/>
                <path fill-rule="evenodd" d="M0 8a8 8 0 1 1 16 0A8 8 0 0 1 0 8zm8-7a7 7 0 0 0-5.468 11.37C3.242 11.226 4.805 10 8 10s4.757 1.225 5.468 2.37A7 7 0 0 0 8 1z"/>
            </svg>
        </div>

        <h1 class="mb-3">Вітаємо, {{ username }}!</h1> 
        
        <p class="fs-5" style="color: var(--secondary-text-color);">Це ваш особистий кабінет.</p>
        
        <div class="d-grid gap-2 mt-5">
            <a href="{{ url_for('users_bp.logout') }}" class="btn btn-outline-danger btn-lg">
                Вийти з системи
            </a>
        </div>

    </div>
</div>
{% endblock %}
